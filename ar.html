<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>طيف | التجربة</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <!-- A-Frame 1.4.1 هو الإصدار الذي تستخدمه أمثلة MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { overflow: hidden; background: transparent; height: 100%; }
    #scene-root { position: fixed; inset: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">رجوع</a>

  <!-- تحميل -->
  <div class="overlay loading" id="loading">
    <div class="spinner"></div>
    <div>جاري تشغيل الكاميرا…</div>
  </div>

  <!-- إطار البحث عن اللوحة -->
  <div class="overlay hidden" id="scanning"><div class="scan-frame"></div></div>
  <div class="scan-hint hidden" id="scan-hint">وجّهي الكاميرا نحو لوحة «طيف»</div>

  <!-- خطأ في الكاميرا -->
  <div class="overlay error-box hidden" id="error">
    <h3>ما قدرنا نشغّل الكاميرا</h3>
    <p class="fineprint">
      تأكدي إنك سمحتي للمتصفح باستخدام الكاميرا، وإن الرابط يبدأ بـ https.
      لو تستخدمين متصفح داخل تطبيق (إنستقرام مثلاً)، افتحي الرابط في Safari أو Chrome.
    </p>
    <a class="btn" href="ar.html">حاولي مرة ثانية</a>
  </div>

  <!-- بطاقة معلومات العمل -->
  <aside class="info-sheet" id="info">
    <h3 id="info-title"></h3>
    <div class="artist" id="info-artist"></div>
    <p id="info-desc"></p>
    <a class="btn ghost" href="home.html" onclick="tayfTrack('take_home_click')">خذ العمل لبيتك</a>
  </aside>

  <div id="scene-root"></div>

  <script>
    (function () {
      const C = window.TAYF;
      const $ = (id) => document.getElementById(id);

      $("info-title").textContent = C.artwork.title;
      $("info-artist").textContent = C.artwork.artist;
      $("info-desc").textContent = C.artwork.description;

      // «عمود الطيف»: حلقات بألوان اللوحة تطلع من قلب القرص باتجاه الزائر
      // مركز القرص في لوحة طيف: x = 0.03 ، y = 0.125 (عرض اللوحة = 1)
      function spectrumSculpture() {
        const PAL = ["#b38b4d", "#185c68", "#c4482a", "#eea834", "#343a78", "#f3ece0", "#d9b77e", "#1c1816"];
        const N = 14;
        let rings = "";
        let topZ = 0;
        for (let i = 0; i < N; i++) {
          const t = i / (N - 1);
          const r = (0.34 * (1 - 0.72 * t)).toFixed(3);
          const z = (0.015 + i * 0.055);
          const tube = (0.006 + 0.016 * (1 - 0.4 * t)).toFixed(4);
          const arc = i % 3 === 0 ? 360 : 200 + ((i * 67) % 150); // حلقات مكسورة مثل اللوحة
          const c = PAL[i % PAL.length];
          const r0 = (i * 53) % 360;
          const dir = i % 2 ? 360 : -360;
          const dur = 6000 + ((i * 937) % 6000);
          rings += `
            <a-entity position="0 0 ${z.toFixed(3)}"
              animation="property: position; from: 0 0 ${z.toFixed(3)}; to: 0 0 ${(z + 0.02).toFixed(3)}; dir: alternate; dur: ${2000 + i * 150}; delay: ${i * 120}; loop: true; easing: easeInOutSine">
              <a-torus radius="${r}" radius-tubular="${tube}" arc="${arc}" segments-tubular="64"
                material="color: ${c}; emissive: ${c}; emissiveIntensity: 0.35; roughness: 0.55; metalness: 0.1"
                rotation="0 0 ${r0}"
                animation="property: rotation; from: 0 0 ${r0}; to: 0 0 ${r0 + dir}; dur: ${dur}; loop: true; easing: linear"></a-torus>
            </a-entity>`;
          topZ = z;
        }
        const coreZ = (topZ + 0.07).toFixed(3);
        return `
          <a-entity id="sculpture" position="0.03 0.125 0"
            animation__rise="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 1100; easing: easeOutBack; startEvents: rise">
            ${rings}
            <a-sphere radius="0.035" position="0 0 ${coreZ}"
              material="color: #f3ece0; emissive: #f3ece0; emissiveIntensity: 0.8"></a-sphere>
            <a-entity position="0 0 ${coreZ}"
              animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: 4000; loop: true; easing: linear">
              <a-sphere radius="0.014" position="0.09 0 0" material="color: #eea834; emissive: #eea834; emissiveIntensity: 0.6"></a-sphere>
              <a-sphere radius="0.011" position="-0.07 0.05 0" material="color: #185c68; emissive: #185c68; emissiveIntensity: 0.6"></a-sphere>
              <a-sphere radius="0.009" position="0 -0.11 0" material="color: #c4482a; emissive: #c4482a; emissiveIntensity: 0.6"></a-sphere>
            </a-entity>
          </a-entity>`;
      }

      // المجسم: GLB لو موجود، وإلا «عمود الطيف»
      const artwork = C.useModel
        ? `<a-gltf-model src="${C.modelSrc}" position="${C.modelPosition}"
             rotation="${C.modelRotation}" scale="${C.modelScale}"></a-gltf-model>`
        : spectrumSculpture();

      // نبني المشهد بالكود عشان مسار اللوحة يجي من config.js
      $("scene-root").innerHTML = `
        <a-scene
          mindar-image="imageTargetSrc: ${C.targetSrc}; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
          color-space="sRGB"
          renderer="colorManagement: true, physicallyCorrectLights"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false">
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-entity light="type: ambient; intensity: 0.9"></a-entity>
          <a-entity light="type: directional; intensity: 1.2" position="0.5 1 1"></a-entity>
          <a-entity id="target" mindar-image-target="targetIndex: 0">${artwork}</a-entity>
        </a-scene>`;

      const scene = document.querySelector("a-scene");
      const target = document.getElementById("target");
      let foundAt = null;
      let firstFound = true;

      function showScanning(on) {
        $("scanning").classList.toggle("hidden", !on);
        $("scan-hint").classList.toggle("hidden", !on);
      }

      scene.addEventListener("arReady", () => {
        $("loading").classList.add("hidden");
        showScanning(true);
        tayfTrack("ar_ready");
      });

      scene.addEventListener("arError", (e) => {
        $("loading").classList.add("hidden");
        $("error").classList.remove("hidden");
        tayfTrack("ar_error");
      });

      target.addEventListener("targetFound", () => {
        showScanning(false);
        $("info").classList.add("show");
        const s = document.getElementById("sculpture");
        if (s) s.emit("rise");
        foundAt = Date.now();
        tayfTrack("target_found", { first: firstFound });
        firstFound = false;
      });

      target.addEventListener("targetLost", () => {
        showScanning(true);
        $("info").classList.remove("show");
        if (foundAt) {
          tayfTrack("view_time", { seconds: Math.round((Date.now() - foundAt) / 1000) });
          foundAt = null;
        }
      });

      // إيقاف الكاميرا عند مغادرة الصفحة
      window.addEventListener("pagehide", () => {
        try { scene.systems["mindar-image-system"].stop(); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
